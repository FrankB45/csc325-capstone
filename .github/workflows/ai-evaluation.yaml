name: AI Response Evaluation

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  eval:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Test the comparison grader
        working-directory: backend
        run: python -m unittest discover -s git_gallery_app/evaluation -p "test_*.py" -v

      - name: Evaluate AI Compare responses
        working-directory: backend
        run: python git_gallery_app/evaluation/run_evaluation.py --mode mock
