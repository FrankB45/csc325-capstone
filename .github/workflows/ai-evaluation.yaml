name: AI Response Evaluation

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  eval:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Test the eval suite (case format, graders, judge)
        run: python -m unittest discover -s evals/compare/tests -t . -v

      - name: Re-grade the recorded baseline against the thresholds
        run: python -m evals.compare.run --offline evals/compare/baseline.json
